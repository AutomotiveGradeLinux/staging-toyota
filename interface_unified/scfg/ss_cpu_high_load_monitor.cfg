# CPU High Load Monitor Configuration File

[Monitor]
Enabled=TRUE

[MonteCarlo]
Enabled=TRUE
SamplingTimeSec=3
SamplingIntervalMicroSec=500
InitiationTimingSec=15
AnlysisProcessCount=3
SleepTimeMSec=100
LogCount=5

[TopCalculation]
